<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>Threads 封鎖名單</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <img src="/logo.png" alt="" class="logo" />
        <h1>封鎖名單</h1>
        <button
          type="button"
          id="feedback-open-button"
          class="header__feedback-button"
          title="問題回報 / 意見回饋 / 提供名單"
        >
          💬
        </button>
      </header>

      <form id="add-form" class="add-form">
        <input
          id="add-input"
          type="text"
          placeholder="使用者名稱或個人檔案網址"
          aria-label="新增封鎖使用者"
          autocomplete="off"
        />
        <button type="submit">新增</button>
      </form>

      <section class="community">
        <div class="community__header">
          <span class="community__title">社群清單</span>
          <button type="button" id="community-refresh-button">更新</button>
        </div>
        <p id="community-status" class="community__status"></p>
      </section>

      <div class="toolbar">
        <button type="button" id="export-button" class="toolbar__button">
          匯出本地名單
        </button>
        <button type="button" id="import-button" class="toolbar__button">
          匯入本地名單
        </button>
        <input
          type="file"
          id="import-file-input"
          accept=".txt,text/plain"
          hidden
        />
      </div>

      <input
        id="search-input"
        type="text"
        class="search-input"
        placeholder="搜尋已封鎖的使用者"
        aria-label="搜尋已封鎖的使用者"
        autocomplete="off"
      />

      <p id="count-label" class="count-label"></p>

      <ul id="block-list" class="block-list"></ul>
    </div>

    <dialog id="feedback-dialog" class="feedback-dialog">
      <form id="feedback-form" class="feedback-form">
        <h2>意見回饋</h2>

        <label class="feedback-field">
          <span>類型</span>
          <select id="feedback-type">
            <option value="提供名單" selected>提供名單</option>
            <option value="問題回報">問題回報</option>
            <option value="意見回饋">意見回饋</option>
          </select>
        </label>

        <button
          type="button"
          id="feedback-fill-list-button"
          class="feedback-fill-button"
        >
          帶入目前的本地封鎖清單
        </button>

        <label class="feedback-field">
          <span>描述</span>
          <textarea
            id="feedback-description"
            rows="5"
            placeholder="請描述問題、建議,或貼上要提供的清單內容"
          ></textarea>
        </label>

        <label class="feedback-field">
          <span>電子郵件(選填)</span>
          <input
            id="feedback-email"
            type="email"
            placeholder="方便的話,留下 email 讓我們回覆你"
            autocomplete="off"
          />
        </label>

        <label class="feedback-field">
          <span>附件(選填)</span>
          <input
            id="feedback-file"
            type="file"
            accept=".txt,text/plain,image/*"
          />
        </label>

        <p id="feedback-status" class="feedback-status"></p>

        <div class="feedback-actions">
          <button type="button" id="feedback-cancel-button">取消</button>
          <button type="submit" id="feedback-submit-button">提交</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
