<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>Threads Cleaner</title>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <img src="/logo.png" alt="" class="logo" />
        <h1 data-i18n="headerTitle">封鎖名單</h1>
        <button
          type="button"
          id="theme-toggle-button"
          class="header__icon-button"
          title="切換淺色/深色主題"
        >
          🌙
        </button>
        <button
          type="button"
          id="feedback-open-button"
          class="header__icon-button"
          data-i18n-title="feedbackButtonTitle"
          title="問題回報 / 意見回饋 / 提供名單"
        >
          💬
        </button>
      </header>

      <form id="add-form" class="add-form">
        <input
          id="add-input"
          type="text"
          placeholder="使用者名稱或個人檔案網址"
          aria-label="新增封鎖使用者"
          autocomplete="off"
          data-i18n-placeholder="addPlaceholder"
          data-i18n-aria-label="addAriaLabel"
        />
        <button type="submit" data-i18n="addButton">新增</button>
      </form>

      <section class="community">
        <div class="community__header">
          <span class="community__title" data-i18n="communityTitle"
            >社群清單</span
          >
          <label
            class="community__auto-update"
            data-i18n-title="communityAutoUpdateTitle"
            title="勾選後,每次開啟這個視窗時,如果距離上次檢查超過一天,會自動檢查社群清單有沒有更新"
          >
            <input type="checkbox" id="community-auto-update-checkbox" />
            <span data-i18n="communityAutoUpdateLabel">自動更新</span>
          </label>
          <button
            type="button"
            id="community-refresh-button"
            data-i18n="communityRefreshButton"
          >
            更新
          </button>
        </div>
        <p id="community-status" class="community__status"></p>
      </section>

      <div class="toolbar">
        <button
          type="button"
          id="export-button"
          class="toolbar__button"
          data-i18n="exportButton"
        >
          匯出本地名單
        </button>
        <button
          type="button"
          id="import-button"
          class="toolbar__button"
          data-i18n="importButton"
        >
          匯入本地名單
        </button>
        <input
          type="file"
          id="import-file-input"
          accept=".txt,text/plain"
          hidden
        />
      </div>

      <input
        id="search-input"
        type="text"
        class="search-input"
        placeholder="搜尋已封鎖的使用者"
        aria-label="搜尋已封鎖的使用者"
        autocomplete="off"
        data-i18n-placeholder="searchPlaceholder"
        data-i18n-aria-label="searchPlaceholder"
      />

      <p id="count-label" class="count-label"></p>

      <ul id="block-list" class="block-list"></ul>
    </div>

    <dialog id="feedback-dialog" class="feedback-dialog">
      <form id="feedback-form" class="feedback-form">
        <div class="feedback-actions">
          <h2 data-i18n="feedbackTitle">意見回饋</h2>
          <div class="feedback-actions__buttons">
            <button
              type="button"
              id="feedback-cancel-button"
              data-i18n="feedbackCancel"
            >
              取消
            </button>
            <button
              type="submit"
              id="feedback-submit-button"
              data-i18n="feedbackSubmit"
            >
              提交
            </button>
          </div>
        </div>
        <label class="feedback-field">
          <span data-i18n="feedbackTypeLabel">類型</span>
          <select id="feedback-type">
            <option value="提供名單" selected data-i18n="feedbackTypeSubmitList">
              提供名單
            </option>
            <option value="問題回報" data-i18n="feedbackTypeBugReport">
              問題回報
            </option>
            <option value="意見回饋" data-i18n="feedbackTypeSuggestion">
              意見回饋
            </option>
          </select>
        </label>

        <button
          type="button"
          id="feedback-fill-list-button"
          class="feedback-fill-button"
          data-i18n="feedbackLoadListButton"
        >
          載入目前的本地封鎖清單
        </button>

        <label class="feedback-field">
          <span data-i18n="feedbackDescriptionLabel">描述</span>
          <textarea
            id="feedback-description"
            rows="5"
            placeholder="請描述問題、建議,或貼上要提供的清單內容"
            data-i18n-placeholder="feedbackDescriptionPlaceholder"
          ></textarea>
        </label>

        <label class="feedback-field">
          <span data-i18n="feedbackEmailLabel">電子郵件(選填)</span>
          <input
            id="feedback-email"
            type="email"
            placeholder="方便的話,留下 email 讓我們回覆你"
            autocomplete="off"
            data-i18n-placeholder="feedbackEmailPlaceholder"
          />
        </label>

        <label class="feedback-field">
          <span data-i18n="feedbackAttachmentLabel">附件(選填)</span>
          <input
            id="feedback-file"
            type="file"
            accept=".txt,text/plain,image/*"
          />
        </label>

        <p id="feedback-status" class="feedback-status"></p>
      </form>
    </dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
